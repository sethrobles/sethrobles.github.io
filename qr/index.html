<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Redirecting…</title>
    <script>
      // Short redirect; use replace so the redirect page isn't kept in history
      setTimeout(function () {
        location.replace("https://sirobles.com");
      }, 150);
    </script>
    <!-- Fallback for users with JS disabled -->
    <noscript>
      <meta http-equiv="refresh" content="0;url=https://sirobles.com">
    </noscript>
    <style>
      /* Self-contained: this page has to render before any stylesheet loads, so
         the token values from site.css are copied here by hand. Keep them in
         step with --bg-primary / --text-primary / --accent if those change. */
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f7f1e3; color:#2c2622; }
      .wrap { text-align:center; max-width:28rem; padding:1rem; }
      a { color:#4f8079; text-decoration:none; font-weight:600; }
      a:hover { text-decoration:underline; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p>Redirecting to <a href="https://sirobles.com">sirobles.com</a>. If you are not redirected automatically, click the link.</p>
    </div>
  </body>
</html>
